media-book:
  - "<#ff69b4><bold>FLAME FFA MEDIA</bold></#ff69b4>\n\n<black>In order to obtain media on Flame FFA you must complete these requirements:\n\n<dark_gray>- 500 followers at the minimum on TikTok"
  - "<black><bold>Requirements</bold>\n<dark_gray>- A video with the Flame FFA server's IP shown on screen for at least 10 seconds with <#ff69b4><bold>10K+</bold></#ff69b4><dark_gray> views"
  - "<black><bold>Keeping Media</bold>\n<dark_gray>To keep your media rank, you must publish a video on the server with the IP shown on screen at least once every 2 weeks."
  - "<black><bold>How to get media?</bold>\n<dark_gray>If you are eligible for media, open a General Support ticket in #tickets, provide evidence of your eligibility for the rank, and you will receive your role in Discord and in the game."
