# FlameStore  /store shows a popup  the button opens the link after the usual minecraft are you sure screen
# every text is minimessage
url: "https://store.flameffa.net"
title: "<bold><gradient:#f2c14e:#e8552f>FLAME FFA STORE</gradient>"
body: "<white>Ranks, crates and more.\n<gray>Every purchase helps keep the server running."
open-button: "<green><bold>Open the store"
close-button: "<gray>Close"
# sent in chat as well so clients that cannot show the popup still get a link
chat: "<gray>Store: <click:open_url:'<url>'><hover:show_text:'<gray>Click to open'><#f2c14e><u>store.flameffa.net</u></hover></click>"

# the store npc  a mannequin with a skin  right or left click opens the store popup
# /flamestore npc places it where you stand  /flamestore npcat <world> <x> <y> <z> <yaw> from the console  /flamestore npcremove
npc:
  enabled: true
  scale: 1.5
  title: "<bold><gradient:#f2c14e:#e8552f>STORE</gradient>"
  title-size: 2.0
  click-sound: block.amethyst_block.chime
  skin:
    name: 1UK3E
    uuid: 8ffea830-177f-48d3-adc5-986536f32638
    value: 
    signature: 

# the rules npc  clicking it opens the rules book  /rules opens it too
# /flamestore rulesnpc places it where you stand  /flamestore rulesnpcat <world> <x> <y> <z> <yaw>  /flamestore rulesnpcremove
rules-npc:
  enabled: true
  scale: 1.0
  title: "<bold><gradient:#f2c14e:#e8552f>RULES</gradient>"
  title-size: 1.5
  click-sound: item.book.page_turn
  # dyed leather boots with the enchanted glint  lime dye colour  empty for none
  boots-color: "#80C71F"
  skin:
    name: MagickArthur_
    uuid: 384ba0b8-3949-482b-8efe-d2ebba9a1198
    value: 
    signature: 
# one entry per page  minimessage  a page fits about 14 short lines
rules-book:
  - "<dark_red><bold>FLAME FFA RULES</bold></dark_red>\n\n<black><bold>Player Behavior</bold>\n<dark_gray>- No racism\n- No slurs\n- No harassment or hate speech\n- No toxicity (minimal swearing is allowed)"
  - "<black><bold>Player Behavior</bold>\n<dark_gray>- No discrimination\n- No threats\n- No leaking private information\n- No advertising\n- No doxxing, attempting to or threatening to"
  - "<black><bold>Client / Mods / Bugs</bold>\n<dark_gray>- No cheating or hacking\n- No unfair advantages\n- No abusing bugs\n- No ec'ing or storing illegal items (items obtained by breaking blocks through map glitches and such)"
  - "<black><bold>Client / Mods / Bugs</bold>\n<dark_gray>- No loopholing rules\n- No duping\n- No pushing people off spawn"
  - "<black><bold>Staff Related</bold>\n<dark_gray>- Staff decisions are <dark_red><bold>FINAL</bold></dark_red>\n- Not listening to staff may result in punishment"

