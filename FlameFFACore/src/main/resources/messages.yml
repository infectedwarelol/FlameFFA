voucher:
  name: "<gold><crate> Key Voucher"
  lore:
    - "<gray>Right click for a <crate> key"
  redeemed: "<prefix><green>+1 <white><crate></white> key."
  failed: "<prefix><red>Something went wrong, you kept the voucher."
  dead: "<prefix><red>The <white><crate></white> crate no longer exists."
  given: "<prefix><green>Gave you <candles>x <white><crate></white> voucher."

weapon:
  tether-attached: "<aqua>Chained to <white><player></white>"
  tether-hooked: "<red><player></red><gray> has you chained"
  tether-snapped: "<gray>The chain snapped."
  tether-expired: "<gray>The chain faded."
  tether-spent: "<gray>The chain gave out."
  tether-gone: "<gray>The chain went slack." 
  comet-too-low: "<gray>Too close to the ground, you need <white><blocks></white> blocks under you"
  comet-finisher: "<gradient:#5fd4ff:#7b3fd6><bold>SHATTERED COMET</bold></gradient>"
  # the meter is one glyph per stack, lit ones for what you have and dark ones for the rest
  overkill-meter-lit: "<gradient:#ffb347:#ff2d00>✦</gradient>"
  overkill-meter-dark: "<#4a1010>✧"
  # what rides the action bar on each hit, just above the experience bar
  overkill-stack: "<gradient:#ff6a00:#8e0b0b><bold>OVERKILL</bold></gradient> <meter>"
  # the bar from the pack, the plugin fills in the glyph for the stack count or the time left
  overkill-bar-glyph: "<white><font:flameffa:hud><glyph></font></white>"
  # without the pack, what the action bar shows while the mace burns
  overkill-lit: "<gradient:#ff6a00:#8e0b0b><bold>OVERKILL</bold></gradient> <meter> <white><seconds>s"
  overkill-not-ready: "<gray>The mace is not lit."
  overkill-faded: "<gray>The mace burned out."
  overkill-blast: "<#ff9b3d>Blast caught <white><hit></white> player(s)"
  aegis-held: "<#9de0ff>The ward held"
  aegis-repelled: "<gray><player>'s ward threw you back"
  cooldown: "<red>Ready in <white><seconds>s</white>"
  unknown: "<prefix><red>No weapon called <white><id></white>."

cooldown-bar:
  # one entry per custom weapon on the hotbar in slot order, colour comes from each weapon's hud-colour
  entry: "<colour><bold><seconds>s"
  ready: "<colour><bold>READY"
  separator: "<dark_gray> // "

