  staff-alert: "<dark_gray>[<red>Chat</red>] <white><player></white> <gray>strike <strikes> <dark_gray><message>"

protection:
  no-break: "<prefix><red>You can't break this!"
  denied: "<prefix><red>You can't build here."

sweep:
  warning: "<prefix><gray>Arena clear in <white><seconds>s</white>."
  done: "<prefix><gray>Arena cleared, <white><blocks></white> blocks and <white><items></white> items."

spawn:
  warmup: "<prefix><gray>Teleporting in <white><seconds>s</white>, don't take damage."
